name: FinShield MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_validate:
    name: Lint, Validate Data Contracts & Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Validation Contract
        run: |
          python src/data_validation.py

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  azure_deploy_preview:
    name: Dry-Run Azure Bicep & Pipeline Manifest
    needs: test_and_validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Azure Bicep Template
        run: |
          az bicep build --file infra/main.bicep
